# Project identification
sonar.projectKey=e-commerce-be
sonar.projectName=E-Commerce Backend API
sonar.projectVersion=1.0.0

# Source & Test Inclusion/Exclusion Rules
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Code Coverage Configuration (Jest LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Technical Stack & Encoding Settings
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Security & Code Quality Vulnerability Rules (OWASP Top 10, Password Hashing, Validation)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S5443
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*

# Tags & Quality Gate Focus Area Keywords
# Focus: OWASP Top 10, Cryptography (Bcrypt/HMAC/Salt), Zod Input Validation, JWT Token Security
sonar.projectTags=owasp-top10,security,auth,zod-validation,bcrypt-salt,jwt